.big small{color:var(--mut);font-size:12px;margin-top:6px;letter-spacing:.08em}

.rest{font:200 30px/1 var(--num);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(var(--hr),.7)}

.ac-tec button:active{transform:scale(.94);background:rgba(var(--nar),.22)}.ac-tec .b0{grid-column:2}.ac-tec .bx{border-color:transparent;box-shadow:none;background:none;font-size:18px;color:#5f7f9f}

.ac-rojo{font:italic 700 16px/1 var(--naf);color:var(--al);text-shadow:0 0 8px rgba(255,77,106,.6)}

.big.t span{font-size:76px}div.big:active{transform:none}
