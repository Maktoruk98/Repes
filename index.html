<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Repes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repes">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0d1014;--card:#171c23;--line:#28303a;--tx:#eef2f6;--mut:#8f9aa8;--ac:#b7f34a;--ink:#10160a;--warn:#ff6b5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 88px);touch-action:manipulation;-webkit-user-select:none;user-select:none;max-width:560px;margin:0 auto}
h2{margin:2px 0 4px;font-size:24px;letter-spacing:-.02em}h3{margin:14px 0 8px;font-size:15px}h3:first-child{margin-top:0}p{margin:8px 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.card.nopad{padding:0;overflow:hidden}.center{text-align:center;padding:28px 16px}
.mut{color:var(--mut);font-size:13px}.pad{padding:10px 14px}
.tag{display:inline-block;font-size:12px;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:2px 10px;margin:4px 0 6px}
.btn{display:block;width:100%;background:var(--ac);color:var(--ink);font-weight:700;border-radius:14px;padding:15px;margin:10px 0;font-size:17px}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:15px;margin:6px 0;white-space:nowrap}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.sb{justify-content:space-between;margin:6px 0}.row.c{justify-content:center}
.inp{width:100%;background:#0f1319;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;margin:6px 0;-webkit-user-select:text;user-select:text;flex:1;min-width:0}
.inp.n{width:76px;flex:none;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:6px 0;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;white-space:nowrap;background:#0f1319}.chip.on{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0}.seg button{flex:1;padding:9px;border-radius:9px;font-size:15px;color:var(--mut)}.seg button.on{background:#2a323d;color:var(--tx);font-weight:600}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(70vw,270px);aspect-ratio:1;border-radius:50%;margin:18px auto;border:8px solid var(--line);background:radial-gradient(circle at 50% 35%,#1f2731,#12161c)}
.big:active{transform:scale(.97)}.big.done{border-color:var(--ac)}
.big span{font-size:104px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.big small{color:var(--mut);font-size:13px;margin-top:6px}
.x{min-width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#0f1319;font-size:18px;padding:0 8px}.x.warn,.warn{color:var(--warn);border-color:var(--warn);font-size:13px}
.rest{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}.li>div:first-child{flex:1;min-width:0}.li .r{white-space:nowrap;font-variant-numeric:tabular-nums}
.li.link{padding:12px 14px}.card>.li:first-of-type{border-top:0}
.sel{margin:14px 0 2px;padding:10px 12px;border-radius:12px;background:#0f1319;border:1px dashed var(--line);font-size:14px}
.back{color:var(--ac);padding:6px 0;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,16,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;padding:10px 0;font-size:13px;color:var(--mut);border-radius:10px}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#2a323d;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.on{opacity:1}
</style>
</head>
<body>
<main id="view"></main>
<div id="toast" role="status"></div>
<nav>
  <button data-act="tab" data-v="entrenar">Entrenar</button>
  <button data-act="tab" data-v="biblioteca">Biblioteca</button>
  <button data-act="tab" data-v="rutinas">Rutinas</button>
  <button data-act="tab" data-v="historial">Historial</button>
</nav>
<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
